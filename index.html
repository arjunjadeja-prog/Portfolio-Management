<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMFI Portfolio Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📊 Mutual Fund Portfolio Tracker</h1>

    <label for="search">Search Fund:</label>
    <input type="text" id="search" placeholder="Type fund name..." />

    <label for="fundSelect">Select Fund:</label>
    <select id="fundSelect"></select>

    <label for="units">Enter Units:</label>
    <input type="number" id="units" min="0" step="any" placeholder="Enter units" />

    <button onclick="calculateValue()">Calculate</button>

    <h2 id="result"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
