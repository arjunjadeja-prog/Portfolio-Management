<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMFI Portfolio Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📊 Mutual Fund Portfolio Tracker</h1>

    <label>Search Fund:</label>
    <input type="text" id="search" placeholder="Type fund name..." />

    <label>Select Fund:</label>
    <select id="fundSelect"></select>

    <label>Enter Units:</label>
    <input type="number" id="units" placeholder="Enter units" />

    <button onclick="calculateValue()">Calculate</button>

    <h2 id="result"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
